<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phelps Cookbook</title>

    <!-- import bootstrap style -->
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <!-- import custom styles.css -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- header -->
        <div class="row">
            <div class="col-sm-12">
                <h1 class="text-center">Phelps Cookbook</h1>
            </div>
        </div>
        <!-- content-->
        <div class="row">
            <!-- ingredients -->
            <div class="col-sm-3" id="ingredients-main">
                <div class="row">
                    <div class="col-sm-12">
                        <h2 class="text-center">Ingredients</h2>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <ul id="ingredients">
                        </ul>
                    </div>
                </div>


            </div>
            <!-- weekly meals -->
            <div class="col-sm-6" id="weekly-meals">

            </div>
            <!-- navigation -->
            <div class="col-sm-3">
                <br><br>
                <div class="row">
                    <div class="col-sm-12">
                        <button onclick="copySharelink()" class="btn btn-block">Share</button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <button onclick="
                            const share_url = getShareLink();
                            const params = new URLSearchParams(share_url.searchParams); 
                            params.delete('name'); 
                            window.location.href = 'see_recipies/index.html?' + params.toString();
                            " class="btn btn-block">See Recipes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!-- import custom index.js -->
<script src="index.js"></script>
